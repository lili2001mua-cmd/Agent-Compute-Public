# Product search on Digikala through the holding's Iranian relay (relay.hohe1.ir).
# Iranian sites are never fetched from this runner; no browser is needed from inside Iran.
# The search itself arrives as an input - nothing about who asked is stored here.
name: digikala
on:
  workflow_dispatch:
    inputs:
      request:
        description: "JSON: queries, pages, must_have, must_not, min_price, max_price, max_pages, top_n"
        required: true
      label:
        description: "Suffix for the artifact name, so a caller can find its own run"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  digikala:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Search via iran-relay
        env:
          REQUEST: ${{ inputs.request }}
          IRAN_RELAY_RUN_KEY: ${{ secrets.IRAN_RELAY_RUN_KEY }}
        run: |
          set -u
          mkdir -p out
          # A failed search is a result worth keeping, not a broken job.
          python3 Sys.scripts/digikala_relay.py 2>&1 | tee out/log.txt || true
      - name: Summary
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "out/render-report.json"
          if not os.path.exists(p):
              print("## No output produced"); raise SystemExit
          d = json.load(open(p, encoding="utf-8"))
          print("## Render results\n")
          print(f"- API calls: **{d['ok']}** ok of **{d['requested']}** - "
                f"failed **{len(d['failed'])}**")
          print(f"- matched targets: **{d.get('targets')}**\n")
          print("| page | html chars | products so far | verdict |")
          print("|---|---|---|---|")
          for pg in d["pages"]:
              if "error" in pg:
                  print(f"| `{pg['url']}` | - | - | error: {pg['error'][:60]} |")
              else:
                  print(f"| `{pg['url']}` | {pg['html_len']} | {pg['products_so_far']} | "
                        f"{'404 body under HTTP 200' if pg['not_found'] else 'ok'} |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "digikala-${{ inputs.label || github.run_id }}"
          path: out/
          retention-days: 7
