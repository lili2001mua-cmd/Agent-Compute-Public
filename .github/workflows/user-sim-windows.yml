# User-simulator visit on Windows (public repo: Windows minutes are free here, not x2 of the private quota).
# Moved from the private repo on 1405-08-07. app_url = public https URL of the .exe/.msi; the file name is kept.
name: user-sim-windows
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public https URL of the Windows installer or executable"
        required: true
      silent_args:
        description: "Silent install args, e.g. /S or /quiet; empty = run the file directly"
        required: false
        default: ""
      dwell_seconds:
        description: "Seconds to wait after the app opens"
        required: false
        default: "12"
permissions:
  contents: read
concurrency:
  group: user-sim-windows
  cancel-in-progress: true
jobs:
  visit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download and visit
        shell: pwsh
        env:
          URL: ${{ inputs.app_url }}
          SILENT: ${{ inputs.silent_args }}
          DWELL: ${{ inputs.dwell_seconds }}
        run: |
          if (-not $env:URL.StartsWith('https://')) { Write-Error 'app_url must be https'; exit 1 }
          $name = [System.IO.Path]::GetFileName(([Uri]$env:URL).AbsolutePath)
          if (-not $name) { $name = 'app.exe' }
          $f = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri $env:URL -OutFile $f
          ./user-sim/user-sim-windows-visit.ps1 -AppPath $f -SilentArgs $env:SILENT -DwellSeconds $env:DWELL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: user-sim-windows-${{ github.run_id }}
          path: user-sim-out/**
          if-no-files-found: warn
          retention-days: 14
