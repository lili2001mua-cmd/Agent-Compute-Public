# enrich — گامِ ۲ی چرخهٔ محتوا، روی رانرِ عمومیِ رایگان.
# ⛔ این مخزن هیچ رازی ندارد و نباید داشته باشد. رسانه فقط با لینکِ موقتِ ورودی می‌آید.
# خروجی فقط به‌صورتِ آرتیفکت برمی‌گردد. ⛔ تنها نوشتن: برچسبِ پایانِ `enriched/<key>/<epoch>` در همین مخزن
# (۱۴۰۵-۰۷-۰۶) تا سشنِ گامِ ۳ ، که به API راه ندارد ولی git را می‌خواند، بی جابِ صورت‌حساب‌دار منتظر بماند.
name: enrich

on:
  workflow_dispatch:
    inputs:
      key:
        description: "کلیدِ بسته"
        required: true
      media_url:
        description: "لینکِ مستقیمِ دانلودِ رسانه (موقت — پس از پایان باطل می‌شود)"
        required: true
      source:
        description: "telegram یا drive"
        required: false
        default: "drive"
      whisper_model:
        description: "small یا medium"
        required: false
        default: "medium"
      media_urls:
        description: "اختیاری — همهٔ ویدیوهای بسته، هر خط «نام لینک» به ترتیبِ پیام (بستهٔ چندویدیویی)"
        required: false
        default: ""

permissions:
  contents: write   # فقط برای برچسبِ پایان — هیچ فایلی نوشته نمی‌شود

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: نصبِ کتابخانه‌ها
        run: pip install --quiet faster-whisper

      - name: نصبِ ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version >/dev/null || { echo "::error::ffmpeg نصب نشد"; exit 1; }

      - name: کشِ مدلِ رونویسی
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ github.event.inputs.whisper_model }}

      - name: دانلودِ رسانه
        # ⛔ لینک هرگز چاپ نمی‌شود؛ در متغیرِ محیطی می‌ماند.
        env:
          MEDIA_URL: ${{ github.event.inputs.media_url }}
          MEDIA_URLS: ${{ github.event.inputs.media_urls }}
          KEY: ${{ github.event.inputs.key }}
          SRC: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          mkdir -p "pool/$SRC/$KEY"
          # ⛔ بستهٔ چندویدیویی (۱۴۰۵-۰۷-۰۶ · بستهٔ b7063): پیش‌تر فقط یک لینک می‌آمد و از ۹ ویدیوی بسته فقط یکی
          # رونویسی شد. حالا هر خطِ MEDIA_URLS یک ویدیوست و همه در پوشهٔ همان بسته می‌نشینند.
          if [ -n "${MEDIA_URLS// /}" ]; then
            N=0
            while read -r NAME URL; do
              [ -n "${URL:-}" ] || continue
              NAME=$(basename "$NAME")
              curl -sSL --fail --retry 3 -o "pool/$SRC/$KEY/$NAME" "$URL"
              SZ=$(stat -c%s "pool/$SRC/$KEY/$NAME")
              [ "$SZ" -gt 10000 ] || { echo "::error::دانلودِ $NAME ناقص بود"; exit 1; }
              N=$((N+1))
            done <<< "$MEDIA_URLS"
            echo "دریافت شد: $N ویدیو"
            [ "$N" -gt 0 ] || { echo "::error::هیچ ویدیویی از media_urls نیامد"; exit 1; }
          else
            curl -sSL --fail -o "pool/$SRC/$KEY/$KEY.mp4" "$MEDIA_URL"
            SZ=$(stat -c%s "pool/$SRC/$KEY/$KEY.mp4")
            echo "حجمِ دریافتی: $SZ بایت"
            [ "$SZ" -gt 10000 ] || { echo "::error::دانلود ناقص بود"; exit 1; }
          fi

      - name: غنی‌سازی — برشِ فریم و رونویسی
        env:
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model }}
        run: python3 Sys.scripts/pool_enrich.py --pool pool

      - name: حذفِ صفحهٔ نمایشِ سنگین از خروجی
        # index.html در سمتِ خصوصی با لینکِ Drive ساخته می‌شود، نه این‌جا با امبدِ base64.
        run: find pool -name index.html -delete || true

      - name: بستهٔ خروجی
        env:
          KEY: ${{ github.event.inputs.key }}
          SRC: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp -r "pool/$SRC/$KEY/." out/
          find out -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.m4v' \) -delete
          # ⛔ با pipefail ، head پس از ۴۰ خط لوله را می‌بندد و ls با SIGPIPE اجرا را قرمز می‌کرد (بستهٔ ۲۰ویدیویی b7052).
          echo "محتوای خروجی ($(find out -type f | wc -l) فایل):"; find out -maxdepth 1 | head -40 || true

      # ⛔ پیش‌نمایشِ یک‌تکه برای بستهٔ چندویدیویی (۱۴۰۵-۰۷-۰۶ · بستهٔ b7052): گزارش فقط لینکِ ویدیوی اول را نشان می‌داد.
      # همهٔ ویدیوها به ترتیبِ پیام پشتِ‌هم در out/preview/preview.mp4 می‌نشینند؛ سمتِ خصوصی آن را به Drive می‌برد.
      # شکستش گامِ ۲ را نمی‌خواباند (رونویسی کامل است)؛ آن‌وقت گزارش به ویدیوی اول برمی‌گردد.
      - name: پیش‌نمایشِ یک‌تکه (بستهٔ چندویدیویی)
        continue-on-error: true
        env:
          KEY: ${{ github.event.inputs.key }}
          SRC: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          mapfile -t V < <(find "pool/$SRC/$KEY" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.m4v' \) | sort -V)
          [ "${#V[@]}" -gt 1 ] || { echo "تک‌ویدیویی — پیش‌نمایشِ یک‌تکه لازم نیست."; exit 0; }
          mkdir -p out/preview tmpv
          VF="scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p"
          i=0
          for f in "${V[@]}"; do
            i=$((i+1)); o="tmpv/$(printf %03d $i).ts"
            if ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$f" | grep -q .; then
              ffmpeg -nostdin -loglevel error -y -i "$f" -vf "$VF" -c:v libx264 -preset veryfast -crf 28 \
                -c:a aac -ar 44100 -ac 2 -b:a 96k -f mpegts "$o"
            else
              ffmpeg -nostdin -loglevel error -y -i "$f" -f lavfi -i anullsrc=r=44100:cl=stereo -shortest -map 0:v -map 1:a \
                -vf "$VF" -c:v libx264 -preset veryfast -crf 28 -c:a aac -ar 44100 -ac 2 -b:a 96k -f mpegts "$o"
            fi
          done
          for t in tmpv/*.ts; do echo "file '$PWD/$t'"; done > tmpv/list.txt
          ffmpeg -nostdin -loglevel error -y -f concat -safe 0 -i tmpv/list.txt -c copy -bsf:a aac_adtstoasc \
            -movflags +faststart out/preview/preview.mp4
          echo "پیش‌نمایش: ${#V[@]} ویدیو · $(stat -c%s out/preview/preview.mp4) بایت"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enriched-${{ github.event.inputs.key }}
          path: out/
          retention-days: 1

      # ⛔ برچسبِ پایان (۱۴۰۵-۰۷-۰۶): سشنِ گامِ ۳ با `git ls-remote` منتظرش می‌ماند و فقط بعد فرود را می‌خواهد.
      - name: برچسبِ پایان — موفق
        if: success()
        env:
          KEY: ${{ github.event.inputs.key }}
        run: |
          T="enriched/$KEY/$(date +%s)"; git tag "$T" && git push -q origin "refs/tags/$T" || echo "::warning::برچسبِ پایان نشست"
      - name: برچسبِ پایان — شکست
        if: failure()
        env:
          KEY: ${{ github.event.inputs.key }}
        run: |
          T="enriched-failed/$KEY/$(date +%s)"; git tag "$T" && git push -q origin "refs/tags/$T" || echo "::warning::برچسبِ شکست نشست"
